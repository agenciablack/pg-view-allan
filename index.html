<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      overflow-x: hidden;
    }

    .page-wrapper {
      position: relative;
      max-width: 1920px;
      margin: 0 auto;
    }

    .page-wrapper > img:not(.botao-img) {
      width: 100%;
      height: auto;
      display: block;
    }

    .btn-overlay {
      position: absolute;
      cursor: pointer;
      z-index: 20;
      /* background: rgba(255, 0, 0, 0.3); */
    }

    .btn-overlay:hover {
    }

    /* Container do botão + saiba mais — pulse sincronizado */
    .botao-group {
      position: absolute;
      z-index: 10;
      top: 16.5%;       /* ← posição vertical do grupo */
      left: 10.6%;      /* ← posição horizontal do grupo */
      width: 33%;       /* ← largura do grupo */
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

/* Imagem Botao.png */
    .botao-img {
      width: 100%;
      height: auto;
    }

    /* Botao "Saiba mais!" 1 */
    .btn-saiba-mais {
      left: 15%;
      right: 61%;
      top: 18.3%;
      height: 1.5%;
    }

    /* Botao "Saiba mais!" 2 */
    .btn-saiba-mais-2 {
      left: 55.5%;
      right: 22%;
      top: 38.05%;
      height: 1.5%;
    }

    /* Ficha Hero */
    .ficha-hero-container {
      position: absolute;
      z-index: 15;
      top: 8.8%;
      left: 81.1%;
      transform: translateX(-50%);
      width: 7.5%;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-8px); }
    }

    .ficha-hero-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Texto e Ícones - Marquee */
    .texto-icones-wrapper {
      position: absolute;
      z-index: 15;
      top: 23.2%;
      left: 0%;
      width: 100%;
      overflow: visible;
    }

    .texto-icones-container {
      transform-origin: center center;
      transform: rotate(1.5deg);
    }

    .texto-icones-track {
      display: flex;
      width: max-content;
      animation: scrollLeft 60s linear infinite;
    }

    .texto-icones-track img {
      width: 100.5vw;
      max-width: 1930px;
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    @keyframes scrollLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .page-wrapper {
      overflow: hidden;
    }

    /* Mobile */
    .mobile-only {
      display: none;
    }

    /* Mobile Texto e Ícones */
    .mobile-texto-wrapper {
      position: absolute;
      z-index: 15;
      top: 18%;
      left: -12.6%;
      width: 100%;
      overflow: visible;
    }

    .mobile-texto-container {
      transform-origin: center center;
      transform: rotate(1.7deg);
    }

    .mobile-texto-track {
      display: flex;
      width: max-content;
      animation: scrollLeft 60s linear infinite;
    }

    .mobile-texto-track img {
      width: 182.5vw;
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    /* Mobile Ficha Hero */
    .mobile-ficha-hero {
      position: absolute;
      z-index: 15;
      top: 6.6%;
      left: 80%;
      transform: translateX(-50%);
      width: 11.5%;
      animation: float 3s ease-in-out infinite;
    }

    .mobile-ficha-hero img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Mobile Botão */
    .mobile-botao-group {
      position: absolute;
      z-index: 10;
      top: 18.1%;
      left: 15.9%;
      width: 72%;
      animation: pulse 2s ease-in-out infinite;
    }

    .mobile-botao-group img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Mobile Botões Link */
    .mobile-btn-1 {
      position: absolute;
      z-index: 20;
      cursor: pointer;
      top: 19.4%;
      left: 26.4%;
      width: 51%;
      height: 2.6%;
    }

    .mobile-btn-2 {
      position: absolute;
      z-index: 20;
      cursor: pointer;
      top: 49.1%;
      left: 26.1%;
      width: 51%;
      height: 4%;
    }

    @media (max-width: 1024px) {
      .desktop-only {
        display: none !important;
      }
      .mobile-only {
        display: block;
        position: relative;
        width: 100%;
        overflow: hidden;
      }
      .mobile-only > img {
        width: 100%;
        height: auto;
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <!-- DESKTOP -->
    <div class="desktop-only">
      <!-- Ficha Hero -->
      <div class="ficha-hero-container" id="fichaHero">
        <img src="ficha hero.png" alt="Ficha Hero">
      </div>

      <img src="VIEW-LP-ALLACABRAL.png" alt="Allan Cabral - Landing Page">
      <a href="https://chat.whatsapp.com/FCQpYHnI4ht3PGu4B2DQKY?mode=gi_t" target="_blank" rel="noopener noreferrer" class="btn-overlay btn-saiba-mais" aria-label="Saiba mais"></a>
      <a href="https://chat.whatsapp.com/FCQpYHnI4ht3PGu4B2DQKY?mode=gi_t" target="_blank" rel="noopener noreferrer" class="btn-overlay btn-saiba-mais-2" aria-label="Saiba mais"></a>
      <!-- Texto e Ícones - Marquee -->
      <div class="texto-icones-wrapper">
        <div class="texto-icones-container">
          <div class="texto-icones-track">
            <img src="TEXTO E ÍCONES.png" alt="Texto e Ícones">
            <img src="TEXTO E ÍCONES.png" alt="Texto e Ícones">
            <img src="TEXTO E ÍCONES.png" alt="Texto e Ícones">
            <img src="TEXTO E ÍCONES.png" alt="Texto e Ícones">
          </div>
        </div>
      </div>

      <div class="botao-group">
        <img src="Botao.png" alt="Botão" class="botao-img">
      </div>
    </div>

    <!-- MOBILE -->
    <div class="mobile-only">
      <img src="VIEW-LP-ALLACABRAL-Mobile.png" alt="Allan Cabral - Mobile">
      <!-- Ficha Hero Mobile -->
      <div class="mobile-ficha-hero" id="mobileFichaHero">
        <img src="ficha hero.png" alt="Ficha Hero">
      </div>
      <!-- Texto e Ícones Mobile -->
      <div class="mobile-texto-wrapper" id="mobileTextoWrapper">
        <div class="mobile-texto-container" id="mobileTextoContainer">
          <div class="mobile-texto-track">
            <img src="TEXTO E ÍCONES.png" alt="Texto e Ícones">
            <img src="TEXTO E ÍCONES.png" alt="Texto e Ícones">
            <img src="TEXTO E ÍCONES.png" alt="Texto e Ícones">
            <img src="TEXTO E ÍCONES.png" alt="Texto e Ícones">
          </div>
        </div>
      </div>
      <!-- Botão Mobile -->
      <div class="mobile-botao-group" id="mobileBotaoGroup">
        <img src="Botao.png" alt="Botão">
      </div>
      <!-- Links Mobile -->
      <a href="https://chat.whatsapp.com/FCQpYHnI4ht3PGu4B2DQKY?mode=gi_t" target="_blank" rel="noopener noreferrer" class="mobile-btn-1" id="mobileBtn1" aria-label="Saiba mais 1"></a>
      <a href="https://chat.whatsapp.com/FCQpYHnI4ht3PGu4B2DQKY?mode=gi_t" target="_blank" rel="noopener noreferrer" class="mobile-btn-2" id="mobileBtn2" aria-label="Saiba mais 2"></a>
    </div>
  </div>

  <script>
    document.querySelectorAll('.btn-overlay, .mobile-btn-1, .mobile-btn-2').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (typeof fbq === 'function') {
          fbq('track', 'Lead');
        }
      });
    });
  </script>
</body>
</html>
